# Run:  cp .env.example .env   (fill in values)   then   docker compose up --build -d
services:
  backend:
    build: ./backend
    container_name: ecr-choco-api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 5000
    expose:
      - "5000"
    networks: [ecr]

  frontend:
    build: ./frontend
    container_name: ecr-choco-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"
    networks: [ecr]

networks:
  ecr:
